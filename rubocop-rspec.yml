inherit_mode:
  merge:
    - plugins
    - Exclude
    - Include

inherit_gem:
  rubocop-discourse-base: rubocop-rspec.yml

plugins:
  - rubocop-rspec_rails

RSpec/DescribeClass:
  Exclude:
    - "**/spec/features/**/*"
    - "**/spec/requests/**/*"
    - "**/spec/routing/**/*"
    - "**/spec/system/**/*"
    - "**/spec/views/**/*"
    - "**/spec/initializers/**/*"
    - "**/spec/integration/**/*"
    - "**/spec/integrity/**/*"
    - "**/spec/tasks/**/*"
    - "**/spec/lib/freedom_patches/**/*"
    - "**/spec/multisite/**/*"

RSpec/EmptyExampleGroup:
  Exclude:
    - "spec/requests/api/*"

RSpec/EmptyLineAfterExample:
  Enabled: true

RSpec/EmptyLineAfterExampleGroup:
  Enabled: true

RSpec/EmptyLineAfterFinalLet:
  Enabled: true

RSpec/EmptyLineAfterHook:
  Enabled: true

RSpec/ExampleWording:
  Enabled: true
  DisallowedExamples:
    - works
    - succeeds
    - fails
    - does something
    - behaves correctly
    - handles it
    - handles errors
    - returns the expected result

RSpec/RepeatedDescription:
  Enabled: true

RSpec/RepeatedExampleGroupDescription:
  Enabled: true

RSpecRails/HttpStatus:
  Enabled: true
